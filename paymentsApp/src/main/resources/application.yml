server:
  port: 8082

spring:
  application:
    name: payment-app

  # Postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: admin
    password: password

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Consumidor
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*" # Permite deserializar JSON a nuestras clases
        spring.json.value.default.type: com.tuempresa.paymentservice.dto.OrderEvent # Mapea el JSON a esta clase
