server:
  port: 8082

logging:
  level:
    org.springframework.kafka: DEBUG
    org.apache.kafka: INFO

spring:
  application:
    name: payment-app

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: kafka-2470b0bd-pyamentsapp.e.aivencloud.com:22372
    properties:
      security.protocol: SSL
    ssl:
      trust-store-type: PEM
      trust-store-certificates: classpath:certs/ca.pem
      key-store-type: PEM
      key-store-certificate-chain: classpath:certs/service.cert
      key-store-key: classpath:certs/service.key
    consumer:
      group-id: payments-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.*"
